name: xnu

# Runner note: macOS hosted runners occasionally fail to allocate
# ("The job was not acquired by Runner of type hosted even after multiple
# attempts"). That is GitHub-side capacity, not a build failure - no step runs.
# Re-run the job from the Actions tab, or push again, until it is picked up.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SANTONI
      runner:
        description: "Runner label: macos-15 (Intel, Xcode 16) | macos-15-arm64 | macos-26 (Intel, Xcode 26) | macos-26-arm64"
        default: macos-15
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, santoni]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"


concurrency:
  # Keyed by runner label too, so a dispatch on another image (or a push) does
  # not cancel a run that is already queued for a scarce macOS pool.
  group: xnu-${{ github.ref }}-${{ inputs.runner || 'push' }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SANTONI' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-14 shipped Xcode 15.x, whose iig matches the xnu-8796 IORPC ABI,
    # but those images were retired on 2026-11-02. macos-15's oldest Xcode
    # (16.0, picked in Deps below) emits IORPC.kernelContent, which this xnu
    # lacks; tools/sweet-iig-compat.py rewrites just that generated code back
    # to the old ABI. Proven on the sibling sweet tree (kernel 0177, run
    # 41322973942, booted and ran normally).
    #
    # macos-15 is the Intel (x86_64) image; macos-15-arm64 is Apple Silicon.
    # Both cross-build the same arm64 kernel. GitHub allocates them from
    # different pools, so when one pool is starved the other is worth trying.
    # macos-26 has no Xcode 16, so it selects Xcode 26 (the adapter and patch
    # 0145 cover its iig output and warning policy).
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host tests and patch validation
        run: |
          # Unified-diff structure of every patch (a corrupt hunk made CI drop
          # 0143/0144) plus the three phase 4 host tests: SDHCI mock, hardened
          # GPT with the SYSTEM log fence, and the console log ring.
          bash tests/run_tests.sh
          # Xcode 16+ iig emits IORPC.kernelContent; the adapter must map every
          # known generated form back to the xnu-8796 ABI and fail closed on
          # anything new.
          python3 tools/check-sweet-iig-compat.py

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          # xnu's makedefs take IIG from the environment when set
          # (makedefs/MakeInc.cmd: ifeq ($(origin IIG),undefined)). Point it at
          # the ABI adapter so the generated .iig.cpp keeps the 8796 layout.
          echo "SWEET_REAL_IIG=$(xcrun --find iig)" >> "$GITHUB_ENV"
          echo "IIG=$GITHUB_WORKSPACE/tools/sweet-iig-compat.py" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          ccache -z
          bash build.sh 2>&1 | tee ../build.log
          ccache -s

      - name: Fail if a Santoni storage patch was skipped
        if: always()
        run: |
          # dxb applies patches with `git apply --check` and only warns on
          # failure, so a malformed hunk silently ships a kernel without that
          # feature (0143 and 0144 were lost this way). Make it fatal.
          if [ ! -f build.log ]; then
            echo "no build.log (build never started)"; exit 0
          fi
          if grep -E 'Skipping patch .*014[234]-santoni' build.log; then
            echo "::error::a Santoni storage patch was skipped by the build"
            exit 1
          fi
          echo "no Santoni storage patch skipped"

      - name: Verify the IIG ABI adapter ran
        if: always()
        run: |
          # The adapter rewrites generated .iig.cpp in place. If Xcode's iig
          # still left kernelContent in the generated code, the build only
          # "succeeded" by accident (or -k hid the error); fail loudly.
          hits=$(grep -rIl "kernelContent" dxb/build --include='*.iig.cpp' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::generated iig code still uses IORPC.kernelContent"
            exit 1
          fi
          if [ -f build.log ] && grep -q "SWEET IIG: normalized" build.log; then
            echo "adapter rewrote generated IORPC access for xnu-8796"
          else
            echo "adapter reported no kernelContent use (iig output already 8796-compatible)"
          fi

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
